<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8.1</title>
  </head>
  <body></body>
  <script>
    let ladder = {
      step: 0,
      up: function () {
        this.step++;
        return this;
      },
      down: function () {
        this.step--;
        return this;
      },
      showstep: function () {
        console.log(this.step);
        return this;
      },
    };
    ladder.up().up().down().showstep();
  </script>
</html>
